<!--
  Representative capture of a classic Greenhouse board application form
  (boards.greenhouse.io). Structure and attribute names mirror the live markup;
  all values are fictional.
-->
<div id="main">
  <h1 class="app-title">Senior Software Engineer</h1>
  <div class="location">Remote — Europe</div>

  <form id="application_form" enctype="multipart/form-data" method="post">
    <h3>Submit your application</h3>
    <ol>
      <li class="field">
        <label for="first_name">First Name <span class="asterisk">*</span></label>
        <input type="text" id="first_name" name="job_application[first_name]" autocomplete="given-name" required />
      </li>
      <li class="field">
        <label for="last_name">Last Name <span class="asterisk">*</span></label>
        <input type="text" id="last_name" name="job_application[last_name]" autocomplete="family-name" required />
      </li>
      <li class="field">
        <label for="email">Email <span class="asterisk">*</span></label>
        <input type="email" id="email" name="job_application[email]" autocomplete="email" required />
      </li>
      <li class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="job_application[phone]" autocomplete="tel" />
      </li>
      <li class="field">
        <label for="job_application_location">Location (City)</label>
        <input type="text" id="job_application_location" name="job_application[location]" autocomplete="off" />
      </li>

      <li class="field file">
        <label for="resume">Resume/CV <span class="asterisk">*</span></label>
        <input type="file" id="resume" name="job_application[resume]" required />
      </li>
      <li class="field file">
        <label for="cover_letter">Cover Letter</label>
        <input type="file" id="cover_letter" name="job_application[cover_letter]" />
      </li>

      <li class="field">
        <label for="job_application_answers_attributes_0_text_value">LinkedIn Profile</label>
        <input
          type="text"
          id="job_application_answers_attributes_0_text_value"
          name="job_application[answers_attributes][0][text_value]"
        />
      </li>
      <li class="field">
        <label for="job_application_answers_attributes_1_text_value">Website</label>
        <input
          type="text"
          id="job_application_answers_attributes_1_text_value"
          name="job_application[answers_attributes][1][text_value]"
        />
      </li>
      <li class="field">
        <label for="job_application_answers_attributes_2_boolean_value">
          Will you now or in the future require visa sponsorship? <span class="asterisk">*</span>
        </label>
        <select id="job_application_answers_attributes_2_boolean_value" name="job_application[answers_attributes][2][boolean_value]">
          <option value="">Please select</option>
          <option value="1">Yes</option>
          <option value="0">No</option>
        </select>
      </li>
      <li class="field">
        <label for="job_application_answers_attributes_3_text_value">
          Why do you want to work here?
        </label>
        <textarea
          id="job_application_answers_attributes_3_text_value"
          name="job_application[answers_attributes][3][text_value]"
          maxlength="2000"
        ></textarea>
      </li>
    </ol>

    <fieldset id="demographic_questions">
      <legend>U.S. Equal Employment Opportunity information (Completion is voluntary)</legend>
      <div class="field">
        <label for="gender">Gender</label>
        <select id="gender" name="job_application[demographic_answers][gender]">
          <option value="">Please select</option>
          <option value="1">Male</option>
          <option value="2">Female</option>
          <option value="3">Decline To Self Identify</option>
        </select>
      </div>
      <div class="field">
        <label for="hispanic_ethnicity">Are you Hispanic/Latino?</label>
        <select id="hispanic_ethnicity" name="job_application[demographic_answers][hispanic_ethnicity]">
          <option value="">Please select</option>
          <option value="1">Yes</option>
          <option value="2">No</option>
          <option value="3">Decline To Self Identify</option>
        </select>
      </div>
      <div class="field">
        <label for="veteran_status">Veteran Status</label>
        <select id="veteran_status" name="job_application[demographic_answers][veteran_status]">
          <option value="">Please select</option>
          <option value="1">I identify as one or more of the classifications of a protected veteran</option>
          <option value="2">I am not a protected veteran</option>
          <option value="3">I don't wish to answer</option>
        </select>
      </div>
      <div class="field">
        <label for="disability_status">Disability Status</label>
        <select id="disability_status" name="job_application[demographic_answers][disability_status]">
          <option value="">Please select</option>
          <option value="1">Yes, I have a disability, or have had one in the past</option>
          <option value="2">No, I do not have a disability and have not had one in the past</option>
          <option value="3">I do not wish to answer</option>
        </select>
      </div>
    </fieldset>

    <input type="hidden" name="authenticity_token" value="REDACTED" />
    <input type="submit" id="submit_app" value="Submit Application" />
  </form>
</div>
