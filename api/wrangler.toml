#:schema node_modules/wrangler/config-schema.json
name = "autofill-sync"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# WEB.md §8 — "Deliberately small. It stores opaque bytes and hands them back."
#
# Create the resources once, then paste the ids here:
#   wrangler d1 create autofill
#   wrangler r2 bucket create autofill-blobs
#   wrangler kv namespace create SESSIONS
#
# And the one secret the service holds:
#   wrangler secret put SERVER_SECRET      # 32+ random bytes, base64
#
# SERVER_SECRET keys the HMAC that produces a deterministic fake salt for
# unknown accounts (§7). Rotating it re-randomises those fakes, which is
# harmless — no real account depends on it.

[[d1_databases]]
binding = "DB"
database_name = "autofill"
database_id = "00000000-0000-0000-0000-000000000000" # replace after `d1 create`

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "autofill-blobs"

[[kv_namespaces]]
binding = "SESSIONS"
id = "0000000000000000000000000000000000" # replace after `kv namespace create`

[observability]
enabled = true

[vars]
# Origin allowed to call the API with credentials. The extension talks to it
# from its own origin, so this is the web app's origin once it exists.
ALLOWED_ORIGIN = "https://app.autofill.dev"

[env.dev.vars]
ALLOWED_ORIGIN = "http://localhost:5173"
